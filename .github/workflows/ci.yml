name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  macos-build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -switch /Applications/Xcode_16.0.app || sudo xcode-select -switch /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Run automated test suite
        run: swift test --scratch-path /tmp/macresourceguard-build

      - name: Build Release application bundle
        run: ./Scripts/package_dmg.sh

      - name: Verify application bundle and DMG
        run: |
          set -euo pipefail
          test -d "dist/MacResourceGuard.app"
          test -f "dist/MacResourceGuard.app/Contents/MacOS/MacResourceGuard"
          test -f "dist/MacResourceGuard.app/Contents/Info.plist"
          plutil -lint "dist/MacResourceGuard.app/Contents/Info.plist"
          test -f dist/*.dmg
          test -f dist/SHA256SUMS.txt
          echo "✓ MacResourceGuard CI build and verification succeeded."
