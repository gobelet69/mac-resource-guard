name: MacResourceGuard
options:
  bundleIdPrefix: com.macresourceguard
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.4"
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

targets:
  MacResourceGuard:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/MacResourceGuardCore
      - path: Sources/MacResourceGuardApp
        excludes:
          - Resources/Info.plist
          - Resources/MacResourceGuard.entitlements
    settings:
      base:
        PRODUCT_NAME: MacResourceGuard
        PRODUCT_BUNDLE_IDENTIFIER: com.macresourceguard.app
        INFOPLIST_FILE: Sources/MacResourceGuardApp/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/MacResourceGuardApp/Resources/MacResourceGuard.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule

  MacResourceGuardTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/MacResourceGuardCore
      - path: Tests/MacResourceGuardTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macresourceguard.tests
        GENERATE_INFOPLIST_FILE: YES
